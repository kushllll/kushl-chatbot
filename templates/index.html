<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KushlBot - AI Assistant</title>
    <link rel="icon" type="image/png" href="/static/pp.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Background Animation -->
    <div class="bg-gradient"></div>
    <div class="bg-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Main Chat Container -->
    <div id="chat-widget">
        <!-- Header -->
        <header>
            <div class="header-left">
                <div class="bot-info">
                    <div class="bot-avatar-wrapper">
                        <img class="bot-avatar" src="/static/pp.png" alt="KushlBot">
                        <span class="status-indicator"></span>
                    </div>
                    <div class="bot-details">
                        <h1 class="bot-name">KushlBot</h1>
                        <span class="bot-status">
                            <span class="status-pulse"></span>
                            GPT-3.5
                        </span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <button id="theme-toggle" class="header-btn" title="Toggle Dark/Light Mode">
                    <i class="fas fa-moon"></i>
                </button>
                <a href="/dashboard" class="header-btn" title="Open Dashboard">
                    <i class="fas fa-th-large"></i>
                </a>
                <button id="clear-history" class="header-btn" title="Clear Chat History">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </header>

        <!-- Chat Messages Area -->
        <div id="chat-area">
            <div class="welcome-section">
                <div class="welcome-icon">
                    <i class="fas fa-robot"></i>
                </div>
                <h2 class="welcome-title">Welcome to KushlBot!</h2>
                <p class="welcome-subtitle">Your intelligent AI assistant is here to help. Ask me anything!</p>
                <div class="suggestions">
                    <button class="suggestion-chip" data-message="What can you help me with?">
                        <i class="fas fa-question-circle"></i> What can you do?
                    </button>
                    <button class="suggestion-chip" data-message="Tell me a fun fact">
                        <i class="fas fa-lightbulb"></i> Fun fact
                    </button>
                    <button class="suggestion-chip" data-message="Help me brainstorm ideas">
                        <i class="fas fa-brain"></i> Brainstorm
                    </button>
                </div>
            </div>
        </div>

        <!-- Input Footer -->
        <footer>
            <div class="input-wrapper">
                <button id="mic-btn" class="input-btn mic-btn" title="Voice Input">
                    <i class="fas fa-microphone"></i>
                </button>
                <div class="input-field-wrapper">
                    <input 
                        type="text" 
                        id="message" 
                        placeholder="Type your message here..." 
                        autocomplete="off"
                        maxlength="2000"
                    />
                    <span class="input-glow"></span>
                </div>
                <button id="send-btn" class="input-btn send-btn" title="Send Message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="footer-info">
                <span class="powered-by">Powered by GPT-3.5</span>
            </div>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
